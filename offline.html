<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Injaazh ERP - Connection Error</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1A1D24;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #f87171; /* red 400 */
    }
    p {
      color: #94a3b8; /* slate 400 */
      font-size: 14px;
      margin-bottom: 30px;
      text-align: center;
      max-width: 400px;
    }
    button {
      -webkit-app-region: no-drag;
      background-color: #6366f1;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #4f46e5;
    }
  </style>
</head>
<body>
  <h1>Connection Failed</h1>
  <p>Unable to connect to the Injaazh ERP server. Please check your internet connection or firewall settings.</p>
  <p id="error-details" style="color: #f87171; font-family: monospace; font-size: 12px; margin-bottom: 20px;"></p>
  <button onclick="retry()">Try Again</button>

  <script>
    // Extract error from URL
    const urlParams = new URLSearchParams(window.location.search);
    const errorMsg = urlParams.get('error');
    const errorCode = urlParams.get('code');
    if (errorMsg) {
      document.getElementById('error-details').innerText = `Error: ${errorMsg} (${errorCode})`;
    }

    function retry() {
      document.querySelector('button').innerText = 'Reconnecting...';
      setTimeout(() => {
        window.location.href = 'https://erp.injaazh.com/';
      }, 500);
    }
  </script>
</body>
</html>
